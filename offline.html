<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1114">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Offline · CMD Notes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(800px 500px at 10% -10%,rgba(95,217,170,.12),transparent 60%),#0b1114;color:#e6eef1;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:440px;background:#121b20;border:1px solid #223139;border-radius:22px;padding:30px 26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.term{font-family:ui-monospace,Menlo,Consolas,monospace;text-align:left;background:#0a1013;border:1px solid #223139;border-radius:12px;padding:14px 16px;font-size:.85rem;line-height:1.7;margin:0 0 22px;color:#8da2ab}
.term b{color:#5fd9aa}.term .r{color:#ff6b6b}
h1{font-size:1.35rem;margin-bottom:8px}
p{color:#8da2ab;font-size:.9rem;line-height:1.6;margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;border:1px solid #2c3f49;border-radius:30px;padding:7px 14px;margin-bottom:18px;color:#8da2ab}
.dot{width:8px;height:8px;border-radius:50%;background:#ff6b6b;animation:b 1.4s infinite}
.pill.on{color:#5fd9aa;border-color:rgba(95,217,170,.4)}.pill.on .dot{background:#5fd9aa;animation:none}
@keyframes b{50%{opacity:.3}}
button{font:inherit;font-weight:800;background:#5fd9aa;color:#06241b;border:0;border-radius:12px;padding:12px 26px;cursor:pointer;width:100%}
button:disabled{opacity:.6}
</style>
</head>
<body>
<div class="card">
  <div class="term">
    <div><b>$</b> ping sheets.google.com</div>
    <div class="r">ping: unknown host — no connection</div>
    <div><b>$</b> _</div>
  </div>
  <h1>You're offline</h1>
  <p>CMD Notes needs an internet connection to reach your Google Sheet. The app will open by itself as soon as the connection is back.</p>
  <div class="pill" id="pill"><i class="dot"></i><span id="st">No connection detected</span></div>
  <button id="retry" type="button">Try again</button>
</div>
<script>
"use strict";
(function () {
  var pill = document.getElementById("pill"), st = document.getElementById("st"), btn = document.getElementById("retry"), going = false;
  function go() { if (going) return; going = true; pill.className = "pill on"; st.textContent = "Back online — opening…"; setTimeout(function () { location.replace("index.html"); }, 700); }
  function update() { if (navigator.onLine) go(); else { pill.className = "pill"; st.textContent = "No connection detected"; } }
  btn.onclick = function () {
    btn.disabled = true; btn.textContent = "Checking…";
    var c = typeof AbortController !== "undefined" ? new AbortController() : null, t = setTimeout(function () { if (c) c.abort(); }, 4000);
    fetch("manifest.json?ping=" + Date.now(), { method: "HEAD", cache: "no-store", signal: c ? c.signal : undefined })
      .then(function () { clearTimeout(t); go(); })
      .catch(function () { clearTimeout(t); btn.disabled = false; btn.textContent = "Try again"; st.textContent = "Still offline"; });
  };
  window.addEventListener("online", update); window.addEventListener("offline", update);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) update(); });
  setInterval(update, 4000); update();
})();
</script>
</body>
</html>
